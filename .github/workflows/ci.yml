# CareerCopilot CI
# 在 push 和 pull_request 时自动运行 pytest。
# 安全约束：
# - 最小权限（contents: read）；
# - 不使用任何凭据或密钥；
# - 不读取本地敏感目录（已被 .gitignore 排除）；
# - 不上传真实数据。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Run tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
